version: '3.8'

services:
  yt-dlp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-dlp-api
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - AUTO_UPDATE_ENABLED=true
      - UPDATE_CHECK_INTERVAL=3600
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - yt-dlp-network

networks:
  yt-dlp-network:
    driver: bridge
